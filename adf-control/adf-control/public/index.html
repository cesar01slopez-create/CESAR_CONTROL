<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órdenes de Servicio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--c:#0f766e}
  body{background:#f1f5f9;color:#0f172a}
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px}
  .inp{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:15px;background:#fff}
  .inp:focus{outline:2px solid var(--c);border-color:var(--c)}
  label.l{display:block;font-size:12px;color:#475569;margin:10px 0 3px;font-weight:600}
  .btn{background:var(--c);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;border:0;display:inline-block;text-align:center}
  .btn:hover{filter:brightness(.88)}.btn:disabled{opacity:.5;cursor:wait}
  .btn2{background:#e2e8f0;color:#0f172a}
  .btnr{background:#dc2626}
  .btnw{background:#16a34a}
  .btns{padding:5px 10px;font-size:12px;border-radius:8px}
  .tab{white-space:nowrap;padding:10px 14px;font-size:14px;font-weight:600;color:#475569;border-bottom:3px solid transparent;cursor:pointer}
  .tab.on{color:var(--c);border-color:var(--c)}
  .chip{padding:5px 12px;border-radius:999px;background:#e2e8f0;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--c);color:#fff}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;color:#475569;padding:8px;border-bottom:2px solid #e2e8f0;white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .wrap{overflow-x:auto}
  canvas.sig{width:100%;height:140px;border:1px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none}
  .modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
  .tabs{overflow-x:auto;display:flex;background:#fff;border-bottom:1px solid #e2e8f0}
</style>
</head>
<body>
<div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2 rounded-lg text-white text-sm shadow-lg"></div>

<!-- LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4 hidden">
  <form id="fLogin" class="card w-full max-w-sm">
    <div class="text-center mb-3">
      <img src="/logo" onerror="this.style.display='none'" class="h-12 mx-auto mb-2" alt="">
      <h1 class="text-xl font-bold app-name">Órdenes de Servicio</h1>
      <p id="lema" class="text-sm text-slate-500"></p>
    </div>
    <label class="l">Usuario</label><input id="lu" class="inp" autocapitalize="none" autocomplete="username" required>
    <label class="l">Contraseña</label><input id="lp" type="password" class="inp" autocomplete="current-password" required>
    <p id="lerr" class="text-red-600 text-sm mt-2"></p>
    <button class="btn w-full mt-3">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <img src="/logo" onerror="this.style.display='none'" class="h-8" alt="">
      <div class="flex-1 min-w-0"><div class="font-bold app-name truncate">Órdenes de Servicio</div><div id="who" class="text-xs text-slate-500 truncate"></div></div>
      <button class="btn btn2 btns" data-a="miPass">Contraseña</button>
      <button class="btn btn2 btns" data-a="salir">Salir</button>
    </div>
    <div id="banner" class="text-sm px-4 py-2 bg-slate-50 text-slate-700 border-t border-slate-100"></div>
  </header>
  <nav class="tabs"><div id="tabs" class="flex max-w-6xl mx-auto w-full"></div></nav>
  <main id="pane" class="max-w-6xl mx-auto p-4"></main>
</div>
<div id="modal"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k){ try { return localStorage.getItem(k) || '' } catch(e){ return '' } }, set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k) } catch(e){} } };
let token = ls.get('ods_tk'), me = null, cfg = { nombre:'Órdenes de Servicio', empresa:'', color:'#0f766e', lema:'', motivos:[], elecItems:[], categorias:[], formatos:[], geotab:false };
let S = { servicios:[], vals:[], usuarios:[], salud:null }, tab = '', filtro = 'Todos', busca = '', capFolio = '', saludCat = '', saludQ = '', kpiP = 'mes', kpiD = '', kpiH = '', agP = '7dias', agTodos = false, agTec = '', cfgEdit = null, cfgId = null;
const ROL = { coord:'Coordinador', tec:'Técnico', soporte:'Soporte', cliente:'Cliente' };
const TABS = {
  coord:[['servicios','Servicios'],['nuevo','Nuevo servicio'],['agenda','Agenda'],['unidades','Unidades'],['solic','Solicitudes'],['usuarios','Usuarios'],['kpi','KPI'],['salud','Salud de equipos'],['config','Configuración']],
  soporte:[['solic','Solicitudes'],['servicios','Servicios'],['agenda','Agenda'],['unidades','Unidades'],['kpi','KPI'],['salud','Salud de equipos']],
  tec:[['servicios','Mis servicios'],['capturar','Capturar ODS'],['agenda','Agenda'],['unidades','Unidades'],['solic','Solicitudes']],
  cliente:[['servicios','Mis órdenes'],['agenda','Agenda'],['unidades','Unidades']] };
const tabsRol = () => TABS[me.rol].filter(([k]) => k !== 'salud' || cfg.geotab);
const ESTATUS = ['Todos','Enviado','En curso','Pendiente de firma','Completado'];
const ESTLBL = { 'Enviado':'Enviados', 'Completado':'Completados', 'Pendiente de firma':'Por firmar' };
const ANCHO = ['dom','lun','mar','mié','jue','vie','sáb'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function toast(m, err){ const t = $('#toast'); t.textContent = m; t.className = 'fixed top-3 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg text-white text-sm shadow-lg ' + (err ? 'bg-red-600' : 'bg-emerald-600'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 4000); }
async function api(p, o = {}){
  const h = {}; if (token) h.Authorization = 'Bearer ' + token;
  let body = o.body; if (body && !(body instanceof FormData)){ h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  const r = await fetch('/api' + p, { method:o.method || 'GET', headers:h, body });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (r.status === 401 && token && p !== '/login'){ salir(); throw new Error('Tu sesión venció, entra de nuevo'); }
  if (!r.ok || d.exito === false) throw new Error(d.error || ('Error ' + r.status));
  return d;
}
const fmtMin = m => m == null ? '—' : m < 1 ? '<1 min' : m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m%60) + ' min';
const fmtTs = t => t ? new Date(t).toLocaleString('es-MX', { timeZone:'America/Mexico_City', dateStyle:'short', timeStyle:'short' }) : '—';
const hoyMx = () => new Date(Date.now() - 6*3600e3).toISOString().slice(0,10);
const badge = (txt, col) => `<span class="badge" style="background:${col[0]};color:${col[1]}">${esc(txt)}</span>`;
const COL = { 'Enviado':['#e2e8f0','#334155'], 'En curso':['#fef3c7','#92400e'], 'Pendiente de firma':['#e0e7ff','#3730a3'], 'Completado':['#d1fae5','#065f46'],
  'Pendiente':['#fee2e2','#991b1b'], 'En atención':['#fef3c7','#92400e'], 'Validada':['#d1fae5','#065f46'], 'Con observaciones':['#ffedd5','#9a3412'],
  'OK':['#d1fae5','#065f46'], 'Advertencia':['#fef3c7','#92400e'], 'Crítico':['#fed7aa','#9a3412'], 'Crítico alto':['#fecaca','#991b1b'], 'Crítico severo':['#7f1d1d','#fff'], 'Desconocido':['#e2e8f0','#334155'] };
const bd = e => badge(e, COL[e] || COL.Enviado);
function waLink(tel, texto){
  const m = String(tel || '').match(/\+?\d[\d\s().-]{8,}\d/); if (!m) return '';
  let d = m[0].replace(/\D/g, ''); if (d.length === 10) d = '52' + d; if (d.length < 11) return '';
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(texto);
}
const fmtDe = s => cfg.formatos.find(f => f.id === (s && s.formato)) || cfg.formatos[0] || { campos:[], titulo:'', elec:false, fotos:true };
const diaLbl = ts => { const d = new Date(ts - 6*3600e3); return `${ANCHO[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
function aplicaCfg(){
  document.title = cfg.nombre; document.documentElement.style.setProperty('--c', cfg.color || '#0f766e');
  document.querySelectorAll('.app-name').forEach(e => e.textContent = cfg.nombre); $('#lema').textContent = cfg.lema || '';
}
function modal(html){ $('#modal').innerHTML = `<div class="modalbg" data-a="cerrarBg"><div class="modal">${html}</div></div>`; }
function cerrar(){ $('#modal').innerHTML = ''; }
const urlAbs = u => location.origin + u;

// ---------- Sesión ----------
async function init(){
  try { cfg = await api('/config'); aplicaCfg(); } catch(e){}
  if (token){ try { me = (await api('/yo')).usuario; return entrar(); } catch(e){} }
  $('#login').classList.remove('hidden');
}
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault(); $('#lerr').textContent = '';
  try { const d = await api('/login', { method:'POST', body:{ usuario:$('#lu').value, password:$('#lp').value } });
    token = d.token; ls.set('ods_tk', token); me = d.usuario; $('#lp').value = ''; entrar();
  } catch(err){ $('#lerr').textContent = err.message; }
});
function salir(){ token = ''; ls.set('ods_tk',''); me = null; clearInterval(window._iv); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); cerrar(); }
async function entrar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = me.nombre + ' · ' + ROL[me.rol];
  $('#banner').style.display = me.rol === 'cliente' ? 'none' : '';
  $('#tabs').innerHTML = tabsRol().map(([k,n]) => `<div class="tab" data-a="tab" data-t="${k}">${n}</div>`).join('');
  if (me.debeCambiar) miPass(true);
  const cargas = [cargaServ()]; if (me.rol !== 'cliente'){ cargas.push(cargaVals(), cargaTurno()); }
  await Promise.all(cargas.map(p => p.catch(() => {})));
  if (me.rol === 'coord') cargaUsuarios().catch(() => {});
  irTab(tabsRol()[0][0]);
  clearInterval(window._iv); window._iv = setInterval(async () => { if (!token || me.rol === 'cliente') return; await cargaTurno(); if (tab === 'solic'){ await cargaVals(); pintaSolic(); } }, 30000);
}
function miPass(forzado){
  modal(`<h3 class="font-bold text-lg mb-1">Cambiar contraseña</h3>${forzado ? '<p class="text-sm text-amber-700">Estás usando la contraseña inicial. Cámbiala para continuar.</p>' : ''}
    <label class="l">Contraseña actual</label><input id="pa" type="password" class="inp">
    <label class="l">Nueva contraseña (mínimo 8 caracteres)</label><input id="pn" type="password" class="inp">
    <div class="flex gap-2 mt-4"><button class="btn" data-a="guardaPass">Guardar</button>${forzado ? '' : '<button class="btn btn2" data-a="cerrar">Cancelar</button>'}</div>`);
}

// ---------- Datos ----------
async function cargaServ(){ S.servicios = (await api('/servicios')).servicios; }
async function cargaVals(){ S.vals = (await api('/validaciones')).validaciones; }
async function cargaUsuarios(){ S.usuarios = (await api('/usuarios')).usuarios; }
async function cargaTurno(){
  try { const t = (await api('/turno')).turno;
    $('#banner').innerHTML = t.length ? '<b>Soporte en turno:</b> ' + t.map(x => `${esc(x.nombre)} (${esc(x.inicio)}–${esc(x.fin)}) · atendiendo ${x.atendiendo}${x.tecnicos.length ? ' [' + x.tecnicos.map(esc).join(', ') + ']' : ''}`).join(' &nbsp;|&nbsp; ')
      : 'Sin soporte en turno en este momento';
  } catch(e){}
}
async function irTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.dataset.t === t));
  const P = { servicios:pintaServ, nuevo:pintaNuevo, capturar:pintaCap, solic:pintaSolic, usuarios:pintaUsers, kpi:pintaKpi, salud:pintaSalud, agenda:pintaAgenda, unidades:pintaUnidades, config:pintaConfig };
  if (t === 'config'){ cfgEdit = null; cfgId = null; }
  try {
    if (['servicios','capturar','nuevo','agenda'].includes(t)) await cargaServ();
    if (t === 'solic' || t === 'capturar') await cargaVals();
    if (['usuarios','nuevo','agenda','config'].includes(t) && me.rol === 'coord') await cargaUsuarios();
  } catch(e){ toast(e.message, 1); }
  P[t]();
}

// ---------- Servicios ----------
function pintaServ(){
  $('#pane').innerHTML = `<div class="card">
    <div class="flex flex-wrap gap-2 items-center mb-3">
      ${ESTATUS.map(f => `<span class="chip ${f === filtro ? 'on' : ''}" data-a="filtro" data-f="${f}">${ESTLBL[f] || f}</span>`).join('')}
      <input id="q" class="inp" style="max-width:260px;margin-left:auto" placeholder="Buscar folio, cliente, técnico, placas..." value="${esc(busca)}">
      ${me.rol === 'coord' ? '<button class="btn btn2 btns" data-a="exportaServ">Exportar Excel</button>' : ''}
    </div><div id="tbl" class="wrap"></div></div>`;
  $('#q').addEventListener('input', e => { busca = e.target.value; pintaTablaServ(); });
  pintaTablaServ();
}
function listaServ(){
  const q = busca.toLowerCase();
  return S.servicios.filter(s => (filtro === 'Todos' || s.estatus === filtro) && (!q || [s.folio, s.cliente, s.tecnico, s.motivo, s.ciudad, s.placas, s.imei, s.economico, s.serie].join(' ').toLowerCase().includes(q)));
}
function pintaTablaServ(){
  const l = listaServ();
  $('#tbl').innerHTML = l.length ? `<table><thead><tr><th>Folio</th><th>Técnico</th><th>Fecha</th><th>Motivo</th><th>Cliente</th><th>Estatus</th><th>Duración</th><th></th></tr></thead><tbody>${l.map(s => `<tr>
    <td class="font-semibold">${esc(s.folio)}</td><td>${esc(s.tecnico)}</td><td class="whitespace-nowrap">${esc(s.fecha)} ${esc(s.hora)}</td><td>${esc(s.motivo)}</td><td>${esc(s.cliente)}</td>
    <td>${bd(s.estatus)}</td><td class="whitespace-nowrap">${fmtMin(s.duracion)}</td>
    <td class="whitespace-nowrap text-right">
      ${me.rol === 'tec' && s.estatus !== 'Completado' ? `<button class="btn btns" data-a="capturar" data-f="${esc(s.folio)}">${s.estatus === 'Enviado' ? 'Iniciar' : 'Continuar'}</button> ` : ''}
      ${s.estatus === 'Pendiente de firma' && ['tec','coord'].includes(me.rol) ? `<button class="btn btns" data-a="linkFirma" data-f="${esc(s.folio)}">Link de firma</button> ` : ''}
      ${s.urlDoc && s.estatus === 'Completado' ? `<a class="btn btn2 btns" href="${esc(s.urlDoc)}" target="_blank">PDF</a> ` : ''}
      ${s.estatus === 'Completado' && ['tec','coord'].includes(me.rol) ? `<button class="btn btn2 btns" data-a="pedirVal" data-f="${esc(s.folio)}">Validar</button> ` : ''}
      <button class="btn btn2 btns" data-a="detalle" data-f="${esc(s.folio)}">Ver</button>
      ${me.rol === 'coord' ? `<button class="btn btnr btns" data-a="borraServ" data-f="${esc(s.folio)}">Eliminar</button>` : ''}
    </td></tr>`).join('')}</tbody></table>` : '<p class="text-slate-500 text-sm py-6 text-center">No hay servicios para mostrar.</p>';
}
function detalle(folio){
  const s = S.servicios.find(x => x.folio === folio); if (!s) return;
  const F = fmtDe(s), f = (l, v) => v ? `<div><div class="text-xs text-slate-500">${esc(l)}</div><div class="text-sm">${esc(v)}</div></div>` : '';
  modal(`<div class="flex justify-between items-start"><h3 class="font-bold text-lg">${esc(s.folio)}</h3>${bd(s.estatus)}</div>
    <div class="text-xs text-slate-500">${esc(F.nombre || '')}</div>
    <div class="grid grid-cols-2 gap-3 mt-3">${f('Técnico',s.tecnico)}${f('Fecha',s.fecha + ' ' + s.hora)}${f('Motivo',s.motivo)}${f('Cliente',s.cliente)}${f('Razón social',s.razon)}${f('Lugar',s.lugar)}
      ${f('Recibe',s.recibe)}${f('Contacto',s.contacto)}${f('Ciudad',s.ciudad)}${f('Estado',s.edo)}
      ${F.campos.filter(c => c.on).map(c => f(c.label, s[c.k])).join('')}
      ${f('Tiempo de servicio', s.duracion != null ? fmtMin(s.duracion) : '')}${f('Abierto',s.abiertoEn ? fmtTs(s.abiertoEn) : '')}${f('Terminado por el técnico',s.terminadoEn ? fmtTs(s.terminadoEn) : '')}${f('Firmado por el cliente',s.estatus === 'Completado' && s.completadoEn ? fmtTs(s.completadoEn) : '')}</div>
    ${s.comentario ? `<div class="mt-3">${f('Comentario del técnico', s.comentario)}</div>` : ''}
    ${s.elec && Object.keys(s.elec).length ? `<div class="mt-3 text-xs text-slate-500">Partes eléctricas</div><div class="grid grid-cols-2 gap-x-3 text-sm">${Object.entries(s.elec).map(([k,v]) => `<div>${esc(k)}: <b>${esc(v)}</b></div>`).join('')}</div>${s.obsElec ? `<div class="mt-2 text-sm">Obs.: ${esc(s.obsElec)}</div>` : ''}` : ''}
    <div class="flex gap-2 mt-4">${s.urlDoc && s.estatus === 'Completado' ? `<a class="btn" href="${esc(s.urlDoc)}" target="_blank">Abrir PDF</a>` : ''}<button class="btn btn2" data-a="cerrar">Cerrar</button></div>`);
}
function exportaServ(){
  const rows = S.servicios.map(s => { const r = { Folio:s.folio, Técnico:s.tecnico, Fecha:s.fecha, Hora:s.hora, Motivo:s.motivo, Cliente:s.cliente, 'Razón social':s.razon, Lugar:s.lugar, Ciudad:s.ciudad, Estado:s.edo, Estatus:s.estatus, 'Tiempo (min)':s.duracion ?? '' };
    fmtDe(s).campos.filter(c => c.on).forEach(c => r[c.label] = s[c.k] || ''); return r; });
  bajaXlsx(rows, 'Servicios', 'servicios.xlsx');
}
function bajaXlsx(rows, hoja, nombre){
  if (typeof XLSX === 'undefined') return toast('No se pudo cargar el generador de Excel', 1);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), hoja); XLSX.writeFile(wb, nombre);
}

// ---------- Nuevo servicio (coordinador) ----------
function pintaNuevo(){
  const tecs = S.usuarios.filter(u => u.rol === 'tec' && u.activo !== false), clientes = [...new Set(S.servicios.map(s => s.cliente).filter(Boolean))];
  const inp = (id, l, ex = '') => `<div><label class="l">${l}</label><input id="n_${id}" class="inp" ${ex}></div>`;
  $('#pane').innerHTML = `<div class="card"><h2 class="font-bold text-lg">Nuevo servicio</h2>
    <div class="grid sm:grid-cols-2 gap-x-4">
      ${inp('folio','Folio *')}
      <div><label class="l">Técnico asignado *</label><select id="n_tec" class="inp"><option value="">Selecciona...</option>${tecs.map(u => `<option>${esc(u.nombre)}</option>`).join('')}</select></div>
      <div><label class="l">Formato de orden</label><select id="n_formato" class="inp">${cfg.formatos.map(f => `<option value="${esc(f.id)}">${esc(f.nombre)}</option>`).join('')}</select></div>
      <div><label class="l">Motivo de la visita</label><select id="n_motivo" class="inp">${cfg.motivos.map(m => `<option>${esc(m)}</option>`).join('')}</select></div>
      ${inp('fecha','Fecha *','type="date" value="' + hoyMx() + '"')}${inp('hora','Hora *','type="time" value="09:00"')}
      ${inp('cliente','Nombre del cliente *','list="dl-cli"')}<datalist id="dl-cli">${clientes.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      ${inp('razon','Razón social')}${inp('lugar','Lugar de atención *')}${inp('recibe','Quien recibe al técnico *')}
      ${inp('contacto','Teléfono de contacto * (para avisos por WhatsApp)','type="tel"')}${inp('ciudad','Ciudad *')}${inp('edo','Estado *')}
      <div><label class="l">¿Instalación de cámara?</label><select id="n_camara" class="inp"><option>No</option><option>Sí</option></select></div>
      ${inp('acc','Accesorios')}
    </div>
    <div class="flex flex-wrap gap-2 mt-4"><button class="btn" data-a="creaServ">Crear y enviar al técnico</button></div>
    <hr class="my-5"><h3 class="font-semibold">Carga masiva desde Excel</h3>
    <p class="text-sm text-slate-500 mb-2">Usa la plantilla de servicios (hoja "Servicios"). Se cargan con el primer formato.</p>
    <input id="n_xls" type="file" accept=".xlsx,.xls" class="text-sm"> <button class="btn btn2 btns" data-a="importa">Importar</button></div>`;
}
async function creaServ(btn){
  const v = id => $('#n_' + id).value.trim(), req = { folio:'folio', tec:'técnico', fecha:'fecha', hora:'hora', cliente:'cliente', lugar:'lugar', recibe:'quien recibe', contacto:'contacto', ciudad:'ciudad', edo:'estado' };
  for (const k in req) if (!v(k)) return toast('Falta: ' + req[k], 1);
  btn.disabled = true;
  try {
    await api('/servicios', { method:'POST', body:{ folioAcuerdo:v('folio'), tecnicoAsignado:v('tec'), formato:v('formato'), motivo:v('motivo'), fecha:v('fecha').split('-').reverse().join('/'), hora:v('hora'), cliente:v('cliente'),
      razonSocial:v('razon'), lugarAtencion:v('lugar'), recibe:v('recibe'), contacto:v('contacto'), ciudad:v('ciudad'), estado:v('edo'), camara:v('camara'), accesorios:v('acc') } });
    toast('Servicio creado'); await cargaServ(); irTab('servicios');
  } catch(e){ toast(e.message, 1); btn.disabled = false; }
}
async function importa(btn){
  const f = $('#n_xls').files[0]; if (!f) return toast('Elige el archivo Excel', 1);
  const fd = new FormData(); fd.append('archivo', f); btn.disabled = true;
  try { const d = await api('/servicios/importar', { method:'POST', body:fd });

}

      <div><label class="l">Nombre de quien firma por el cliente</label><input name="nombreCliente" class="inp mb-2"><canvas class="sig" id="sigC"></canvas>

        <p class="text-xs text-slate-500 mt-1">Si el cliente ya no está, déjala vacía: al terminar se genera un link para que firme desde su celular.</p></div>

function muestraForm(){
  const s = S.servicios.find(x => x.folio === capFolio), f = $('#fcap');
  if (!s){ f.classList.add('hidden'); $('#cinfo').textContent = ''; return; }
  $('#cinfo').innerHTML = `<b>${esc(s.cliente)}</b> · ${esc(s.lugar)}, ${esc(s.ciudad)} · ${esc(s.fecha)} ${esc(s.hora)} · Recibe: ${esc(s.recibe)} (${esc(s.contacto)})`
    + (s.estatus === 'Pendiente de firma' ? '<br><span class="text-indigo-700">Esta orden espera la firma del cliente. Si la capturas de nuevo se reemplaza lo anterior.</span>' : '');
  $('#fcapBody').innerHTML = cuerpoForm(s); f.classList.remove('hidden'); iniFirma('sigC'); iniFirma('sigT');
}
function iniFirma(id){
  const c = $('#' + id), r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1; c.width = r.width * k; c.height = r.height * k;
  const g = c.getContext('2d'); g.scale(k, k); g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = '#0f172a'; sigs[id] = false;
  let d = false; const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { d = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); };
  c.onpointermove = e => { if (!d) return; g.lineTo(...pos(e)); g.stroke(); sigs[id] = true; };
  c.onpointerup = c.onpointercancel = () => { d = false; };
}
function limpiaSig(id){ const c = $('#' + id); c.getContext('2d').clearRect(0, 0, c.width, c.height); sigs[id] = false; }
async function reducir(file){
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } catch(e){ return file; }
}
async function generaOds(e){
  e.preventDefault(); const f = $('#fcap'), btn = $('#bGen');
  for (const el of f.querySelectorAll('input[data-req="1"]')) if (!el.value.trim()) return toast('Falta: ' + el.dataset.lbl, 1);
  if (!sigs.sigT) return toast('Falta la firma del técnico', 1);
  const remota = !sigs.sigC;
  if (remota && !confirm('El cliente no firmó. Se creará un link para que firme desde su celular y el PDF final se generará cuando lo haga. ¿Continuar?')) return;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const fd = new FormData(); fd.append('folioAcuerdo', capFolio);
    for (const el of f.elements){
      if (!el.name) continue;
      if (el.type === 'file'){ for (const file of el.files) fd.append(el.name, await reducir(file), file.name.replace(/\.\w+$/, '') + '.jpg'); }
      else if (el.type === 'radio'){ if (el.checked) fd.append(el.name, el.value); }
      else fd.append(el.name, el.value);
    }
    if (!remota) fd.append('firmaCliente', $('#sigC').toDataURL('image/png'));
    fd.append('firmaTecnico', $('#sigT').toDataURL('image/png'));
    const d = await api('/generar-ods', { method:'POST', body:fd });
    await cargaServ(); capFolio = '';
    if (d.pendienteFirma) { linkModal(d.firmaUrl, d.folio, d.contacto, ''); }
    else modal(`<h3 class="font-bold text-lg">ODS generada</h3><p class="text-sm text-slate-600 mt-1">El servicio quedó completado.</p>
      <div class="flex gap-2 mt-4"><a class="btn" href="${esc(d.descargaUrl)}" target="_blank">Abrir / descargar PDF</a><button class="btn btn2" data-a="cerrar">Cerrar</button></div>`);
    irTab('servicios');
  } catch(err){ toast(err.message, 1); btn.disabled = false; btn.textContent = 'Terminar y generar ODS'; }
}
document.addEventListener('submit', e => { if (e.target.id === 'fcap') generaOds(e); });

  const full = urlAbs(url), msg = `Hola${cliente ? ' ' + cliente : ''}, de ${cfg.empresa || cfg.nombre}: por favor revise y firme de conformidad la orden de servicio ${folio} desde su celular (el link vale 7 días): ${full}`, wa = waLink(contacto, msg);
  modal(`<h3 class="font-bold text-lg">Link para que el cliente firme</h3>
    <p class="text-sm text-slate-600 mt-1">Folio ${esc(folio)}. El cliente lo abre en su celular, revisa la orden y firma con el dedo. Vale 7 días y solo se puede usar una vez.</p>

      ${wa ? `<a class="btn btnw" href="${esc(wa)}" target="_blank">Enviar por WhatsApp</a>` : '<span class="text-xs text-slate-500">No hay un teléfono válido del cliente para WhatsApp.</span>'}

function editaUser(un){
  const u = S.usuarios.find(x => x.usuario === un); if (!u) return;
  modal(`<h3 class="font-bold text-lg">Editar ${esc(u.usuario)}</h3>
    <label class="l">Nombre</label><input id="e_nombre" class="inp" value="${esc(u.nombre)}">
    <label class="l">Rol</label><select id="e_rol" class="inp">${Object.entries(ROL).map(([k,n]) => `<option value="${k}" ${k === u.rol ? 'selected' : ''}>${n}</option>`).join('')}</select>
    <label class="l">Teléfono</label><input id="e_tel" class="inp" value="${esc(u.telefono || '')}">
    <label class="l">Cliente (solo para rol Cliente)</label><input id="e_cli" class="inp" value="${esc(u.cliente || '')}">
    <div class="grid grid-cols-2 gap-3"><div><label class="l">Turno inicio (soporte)</label><input id="e_ti" type="time" class="inp" value="${esc(u.turno ? u.turno.inicio.padStart(5,'0') : '07:00')}"></div>
      <div><label class="l">Turno fin</label><input id="e_tf" type="time" class="inp" value="${esc(u.turno ? u.turno.fin.padStart(5,'0') : '15:00')}"></div></div>
    <label class="l">Nueva contraseña (déjala vacía para no cambiarla)</label><input id="e_pass" class="inp">
    <label class="l"><input type="checkbox" id="e_act" ${u.activo === false ? '' : 'checked'}> Usuario activo</label>
    <div class="flex flex-wrap gap-2 mt-4"><button class="btn" data-a="guardaUser" data-u="${esc(u.usuario)}">Guardar</button>
      <button class="btn btnr" data-a="borraUser" data-u="${esc(u.usuario)}">Eliminar</button><button class="btn btn2" data-a="cerrar">Cancelar</button></div>`);
}

// ---------- KPI ----------
async function pintaKpi(){
  const P = [['hoy','Hoy'],['ayer','Ayer'],['semana','Esta semana'],['mes','Este mes'],['todas','Todas'],['personalizado','Personalizado']];
  $('#pane').innerHTML = `<div class="flex flex-wrap gap-2 mb-3 items-center">${P.map(([k,n]) => `<span class="chip ${k === kpiP ? 'on' : ''}" data-a="kpiP" data-p="${k}">${n}</span>`).join('')}
    ${kpiP === 'personalizado' ? `<input type="date" id="kd" class="inp" style="width:auto" value="${kpiD}"><input type="date" id="kh" class="inp" style="width:auto" value="${kpiH}"><button class="btn btns" data-a="kpiAplica">Aplicar</button>` : ''}</div><div id="kbody" class="text-slate-500">Cargando...</div>`;
  try {
    const q = `?periodo=${kpiP}&desde=${kpiD}&hasta=${kpiH}`, k = await api('/kpi' + q), t = k.total;
    const card = (l, v, s = '') => `<div class="card"><div class="text-xs text-slate-500">${l}</div><div class="text-2xl font-bold">${v}</div><div class="text-xs text-slate-500">${s}</div></div>`;
    const tb = (tit, l) => `<div class="card mb-4"><h3 class="font-semibold mb-2">${tit}</h3><div class="wrap"><table><thead><tr><th>${tit.includes('técnico') ? 'Técnico' : 'Motivo'}</th><th>Servicios</th><th>Completados</th><th>Por firmar</th><th>En curso</th><th>Sin abrir</th><th>Promedio</th><th>Mediana</th></tr></thead><tbody>
      ${l.map(x => `<tr><td>${esc(x.nombre)}</td><td>${x.servicios}</td><td>${x.completados}</td><td>${x.porFirmar}</td><td>${x.enCurso}</td><td>${x.sinAbrir}</td><td>${fmtMin(x.prom)}</td><td>${fmtMin(x.mediana)}</td></tr>`).join('') || '<tr><td colspan="8" class="text-slate-500">Sin datos en este periodo.</td></tr>'}</tbody></table></div></div>`;
    $('#kbody').outerHTML = `<div id="kbody"><div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${card('Servicios', t.servicios)}${card('Completados', t.completados, 'firmados por el cliente · ' + t.porFirmar + ' por firmar')}${card('En curso', t.enCurso, '· ' + t.sinAbrir + ' sin abrir')}${card('Tiempo de servicio', fmtMin(t.prom), 'promedio · mediana ' + fmtMin(t.mediana))}</div>${tb('Por técnico', k.porTecnico)}${tb('Por motivo', k.porMotivo)}</div>`;
  } catch(e){ $('#kbody').textContent = e.message; }
}

// ---------- Salud de equipos ----------
async function pintaSalud(forzar){
  $('#pane').innerHTML = '<p class="text-slate-500">Consultando Geotab...</p>';
  try { S.salud = await api('/salud' + (forzar ? '?forzar=1' : '')); } catch(e){ $('#pane').innerHTML = `<div class="card text-red-700">${esc(e.message)}</div>`; return; }
  if (!S.salud.configurado){ $('#pane').innerHTML = `<div class="card"><h2 class="font-bold text-lg">Salud de equipos</h2><p class="text-sm mt-2">Geotab todavía no está conectado.</p></div>`; return; }
  pintaSaludTabla(true);
}
function pintaSaludTabla(full){
  const U = S.salud.unidades, n = U.length, cnt = c => U.filter(u => u.categoria === c).length;
  const ok = cnt('OK'), crit = U.filter(u => u.categoria.startsWith('Crítico')).length;
  const q = saludQ.toLowerCase(), l = U.filter(u => (!saludCat || u.categoria === saludCat) && (!q || [u.nombre, u.serie, u.vin, u.placas].join(' ').toLowerCase().includes(q)));
  if (full) $('#pane').innerHTML = `<div class="grid grid-cols-3 gap-3 mb-3">
      <div class="card"><div class="text-xs text-slate-500">Unidades totales</div><div class="text-2xl font-bold">${n}</div></div>
      <div class="card"><div class="text-xs text-slate-500">GPS al día</div><div class="text-2xl font-bold">${n ? Math.round(ok * 100 / n) : 0}%</div></div>
      <div class="card"><div class="text-xs text-slate-500">Críticas GPS</div><div class="text-2xl font-bold">${crit}</div></div></div>
    <div class="card"><div class="flex flex-wrap gap-2 items-center mb-3">
      <span class="chip ${saludCat === '' ? 'on' : ''}" data-a="saludCat" data-c="">Todas (${n})</span>
      ${cfg.categorias.map(([c, d]) => `<span class="chip ${saludCat === c ? 'on' : ''}" data-a="saludCat" data-c="${c}" title="${esc(d)}">${c} (${cnt(c)})</span>`).join('')}
      <input id="sq" class="inp" style="max-width:240px;margin-left:auto" placeholder="Buscar unidad, serie, VIN..." value="${esc(saludQ)}">
      <button class="btn btn2 btns" data-a="saludXls">Excel</button><button class="btn btn2 btns" data-a="saludRef">Actualizar</button></div>
      <p class="text-xs text-slate-500 mb-2">Actualizado: ${fmtTs(S.salud.actualizado)} · se refresca cada 60 minutos.</p>
      <div id="stbl" class="wrap"></div></div>`;
  document.querySelectorAll('[data-a="saludCat"]').forEach(e => e.classList.toggle('on', e.dataset.c === saludCat));
  const sq = $('#sq'); if (sq && !sq._b){ sq._b = 1; sq.addEventListener('input', e => { saludQ = e.target.value; pintaSaludTabla(false); }); }
  $('#stbl').innerHTML = `<table><thead><tr><th>Unidad</th><th>Serie</th><th>VIN</th><th>Placas</th><th>Última comunicación</th><th>Días</th><th>Categoría</th></tr></thead><tbody>
    ${l.slice(0, 1000).map(u => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.serie)}</td><td>${esc(u.vin)}</td><td>${esc(u.placas)}</td><td>${fmtTs(u.ultima && Date.parse(u.ultima))}</td><td>${u.dias ?? '—'}</td><td>${bd(u.categoria)}</td></tr>`).join('') || '<tr><td colspan="7" class="text-slate-500">Sin resultados.</td></tr>'}</tbody></table>`;
}

// ---------- Configuración (coordinador): identidad, logo y formatos de orden ----------
const guardaId = () => { if ($('#c_nombre')) cfgId = { nombre:$('#c_nombre').value, empresa:$('#c_empresa').value, lema:$('#c_lema').value, color:$('#c_color').value, nota:$('#c_nota').value }; };
const nuevoFormato = () => ({ id:'', nombre:'Nuevo formato', titulo:'', elec:false, logo:false, fotos:true,
  campos: JSON.parse(JSON.stringify((cfg.formatos[0] || { campos:[] }).campos)).map(c => ({ ...c })) });
function pintaConfig(){
  if (!cfgEdit) cfgEdit = JSON.parse(JSON.stringify(cfg.formatos));
  const X = cfgId || cfg;
  $('#pane').innerHTML = `<div class="card mb-4"><h2 class="font-bold text-lg">Identidad</h2>
    <div class="grid sm:grid-cols-2 gap-x-4">
      <div><label class="l">Nombre del sistema</label><input id="c_nombre" class="inp" value="${esc(X.nombre)}"></div>
      <div><label class="l">Nombre de la empresa (sale en el PDF)</label><input id="c_empresa" class="inp" value="${esc(X.empresa)}"></div>
      <div><label class="l">Frase en la pantalla de ingreso</label><input id="c_lema" class="inp" value="${esc(X.lema)}"></div>
      <div><label class="l">Color principal</label><input id="c_color" type="color" class="inp" style="height:42px;padding:3px" value="${esc(X.color)}"></div>
    </div>
    <label class="l">Texto al pie de cada ODS (opcional: teléfonos, avisos)</label><textarea id="c_nota" class="inp" rows="2">${esc(X.nota)}</textarea>
    <div class="flex flex-wrap items-center gap-3 mt-3"><img src="/logo?${Date.now()}" onerror="this.style.display='none'" style="height:48px" alt="">
      <input id="c_logo" type="file" accept="image/png,image/jpeg" class="text-sm"><button class="btn btn2 btns" data-a="subeLogo">Subir logo</button><button class="btn btn2 btns" data-a="quitaLogo">Quitar logo</button></div>
    <p class="text-xs text-slate-500 mt-1">El logo es opcional. En cada formato eliges si se muestra o no en el PDF. Máximo 1 MB, PNG o JPG.</p></div>
    <div id="fmts">${cfgEdit.map(fmtCard).join('')}</div>
    <div class="flex flex-wrap gap-2 mt-2"><button class="btn btn2" data-a="addFmt">+ Nuevo formato</button><button class="btn" data-a="guardaCfg">Guardar configuración</button></div>`;
}
function fmtCard(f, i){
  return `<div class="card mb-4"><div class="flex flex-wrap justify-between gap-2"><h3 class="font-semibold">Formato ${i + 1}</h3>
      <div class="flex gap-2"><button class="btn btn2 btns" data-a="dupFmt" data-i="${i}">Duplicar</button>${cfgEdit.length > 1 ? `<button class="btn btnr btns" data-a="delFmt" data-i="${i}">Eliminar</button>` : ''}</div></div>
    <div class="grid sm:grid-cols-2 gap-x-4"><div><label class="l">Nombre del formato</label><input class="inp" data-i="${i}" data-fp="nombre" value="${esc(f.nombre)}"></div>
      <div><label class="l">Título en el PDF</label><input class="inp" data-i="${i}" data-fp="titulo" placeholder="Igual al nombre" value="${esc(f.titulo)}"></div></div>
    <div class="flex flex-wrap gap-x-6 gap-y-1 mt-3 text-sm">
      <label><input type="checkbox" data-i="${i}" data-fp="logo" ${f.logo ? 'checked' : ''}> Mostrar logo en el PDF</label>
      <label><input type="checkbox" data-i="${i}" data-fp="elec" ${f.elec ? 'checked' : ''}> Incluir tabla de partes eléctricas</label>
      <label><input type="checkbox" data-i="${i}" data-fp="fotos" ${f.fotos ? 'checked' : ''}> Incluir fotos</label></div>
    <div class="wrap mt-3"><table><thead><tr><th>Usar</th><th>Nombre del campo</th><th>Obligatorio</th></tr></thead><tbody>
      ${f.campos.map(c => `<tr><td><input type="checkbox" data-i="${i}" data-ck="${c.k}" data-cp="on" ${c.on ? 'checked' : ''}></td>
        <td><input class="inp" data-i="${i}" data-ck="${c.k}" data-cp="label" value="${esc(c.label)}"></td>
        <td><input type="checkbox" data-i="${i}" data-ck="${c.k}" data-cp="req" ${c.req ? 'checked' : ''}></td></tr>`).join('')}</tbody></table></div></div>`;
}
function enlazaCfg(e){
  const el = e.target, i = el.dataset.i; if (i === undefined || !cfgEdit) return;
  const F = cfgEdit[+i], val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.fp) F[el.dataset.fp] = val;
  else if (el.dataset.ck){ const c = F.campos.find(x => x.k === el.dataset.ck); if (c) c[el.dataset.cp] = val; }
}
document.addEventListener('input', enlazaCfg); document.addEventListener('change', enlazaCfg);
async function guardaCfg(btn){
  btn.disabled = true;
  try {
    const d = await api('/config', { method:'PUT', body:{ nombre:$('#c_nombre').value, empresa:$('#c_empresa').value, lema:$('#c_lema').value, color:$('#c_color').value, nota:$('#c_nota').value, formatos:cfgEdit } });
    const nueva = await api('/config'); cfg = nueva; aplicaCfg(); cfgEdit = null; cfgId = null; toast('Configuración guardada'); pintaConfig();
  } catch(e){ toast(e.message, 1); } btn.disabled = false;
}
async function subeLogo(btn){
  const f = $('#c_logo').files[0]; if (!f) return toast('Elige una imagen', 1);
  const fd = new FormData(); fd.append('logo', f); btn.disabled = true;
  try { await api('/config/logo', { method:'POST', body:fd }); toast('Logo guardado'); pintaConfig(); } catch(e){ toast(e.message, 1); } btn.disabled = false;
}

// ---------- Acciones (delegación de eventos) ----------
const A = {
  tab: d => irTab(d.t), salir, miPass: () => miPass(false), cerrar, cerrarBg: (d, e) => { if (e.target.classList.contains('modalbg')) cerrar(); },
  filtro: d => { filtro = d.f; pintaServ(); }, detalle: d => detalle(d.f), exportaServ,
  capturar: async d => { capFolio = d.f; await abrirSi(d.f); irTab('capturar'); },
  creaServ: (d, e, b) => creaServ(b), importa: (d, e, b) => importa(b),
  borraServ: async d => { if (!confirm('¿Eliminar el servicio ' + d.f + '?')) return; try { await api('/servicios/' + encodeURIComponent(d.f), { method:'DELETE' }); await cargaServ(); pintaTablaServ(); toast('Eliminado'); } catch(e){ toast(e.message, 1); } },
  limpiaSig: d => limpiaSig(d.s), linkFirma: d => linkFirma(d.f),
  copiaLink: async () => { const i = $('#lnk'); try { await navigator.clipboard.writeText(i.value); toast('Link copiado'); } catch(e){ i.select(); document.execCommand('copy'); toast('Link copiado'); } },
  guardaPass: async () => { try { await api('/yo/password', { method:'PUT', body:{ actual:$('#pa').value, nueva:$('#pn').value } }); toast('Contraseña actualizada'); if (me) me.debeCambiar = false; cerrar(); } catch(e){ toast(e.message, 1); } },
  pedirVal: d => pedirVal(d.f),
  enviaVal: async d => { try { await api('/validaciones', { method:'POST', body:{ folio:d.f, nota:$('#vn').value } }); cerrar(); toast('Solicitud enviada a soporte'); } catch(e){ toast(e.message, 1); } },
  atender: async d => { try { await api('/validaciones/' + d.i + '/atender', { method:'PUT' }); } catch(e){ toast(e.message, 1); } await cargaVals(); cargaTurno(); pintaSolic(); },
  resolver: d => resolver(d.i),
  guardaRes: async d => { try { await api('/validaciones/' + d.i + '/resolver', { method:'PUT', body:{ resultado:$('#rr').value, comentario:$('#rc').value } }); cerrar(); toast('Solicitud resuelta'); } catch(e){ toast(e.message, 1); } await cargaVals(); cargaTurno(); pintaSolic(); },
  borraVal: async d => { if (!confirm('¿Eliminar esta solicitud?')) return; try { await api('/validaciones/' + d.i, { method:'DELETE' }); } catch(e){ toast(e.message, 1); } await cargaVals(); pintaSolic(); },
  creaUser: (d, e, b) => creaUser(b), editaUser: d => editaUser(d.u),
  guardaUser: async d => {
    const rol = $('#e_rol').value, body = { nombre:$('#e_nombre').value, rol, activo:$('#e_act').checked, telefono:$('#e_tel').value };
    if ($('#e_cli').value) body.cliente = $('#e_cli').value;
    if ($('#e_pass').value) body.password = $('#e_pass').value;
    if (rol === 'soporte'){ body.turnoInicio = $('#e_ti').value; body.turnoFin = $('#e_tf').value; }
    try { await api('/usuarios/' + encodeURIComponent(d.u), { method:'PUT', body }); cerrar(); toast('Usuario actualizado'); await cargaUsuarios(); pintaUsers(); cargaTurno(); } catch(e){ toast(e.message, 1); }
  },
  borraUser: async d => { if (!confirm('¿Eliminar al usuario ' + d.u + '? Mejor desactívalo si quieres conservar su historial.')) return;
    try { await api('/usuarios/' + encodeURIComponent(d.u), { method:'DELETE' }); cerrar(); toast('Usuario eliminado'); await cargaUsuarios(); pintaUsers(); } catch(e){ toast(e.message, 1); } },
  kpiP: d => { kpiP = d.p; pintaKpi(); }, kpiAplica: () => { kpiD = $('#kd').value; kpiH = $('#kh').value; pintaKpi(); },
  agP: d => { agP = d.p; pintaAgenda(); },
  saludCat: d => { saludCat = d.c; pintaSaludTabla(false); }, saludRef: () => pintaSalud(true),
  saludXls: () => { const q = saludQ.toLowerCase(); bajaXlsx((S.salud.unidades || []).filter(u => (!saludCat || u.categoria === saludCat) && (!q || [u.nombre, u.serie, u.vin, u.placas].join(' ').toLowerCase().includes(q)))
    .map(u => ({ Unidad:u.nombre, Serie:u.serie, VIN:u.vin, Placas:u.placas, 'Última comunicación':u.ultima || '', Días:u.dias ?? '', Categoría:u.categoria })), 'Salud', 'salud_equipos.xlsx'); },
  guardaCfg: (d, e, b) => guardaCfg(b), subeLogo: (d, e, b) => subeLogo(b),
  quitaLogo: async () => { try { await api('/config/logo', { method:'DELETE' }); toast('Logo quitado'); pintaConfig(); } catch(e){ toast(e.message, 1); } },
  addFmt: () => { guardaId(); cfgEdit.push(nuevoFormato()); pintaConfig(); },
  dupFmt: d => { guardaId(); const c = JSON.parse(JSON.stringify(cfgEdit[+d.i])); c.id = ''; c.nombre += ' (copia)'; cfgEdit.splice(+d.i + 1, 0, c); pintaConfig(); },
  delFmt: d => { if (!confirm('¿Eliminar este formato? Las órdenes que lo usan pasarán al primer formato.')) return; guardaId(); cfgEdit.splice(+d.i, 1); pintaConfig(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset, e, b); });
init();
</script>
</body>
