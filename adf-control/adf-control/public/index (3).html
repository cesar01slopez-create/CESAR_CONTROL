<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órdenes de Servicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--c:#0f766e}
  body{background:#f1f5f9;color:#0f172a}
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:16px}
  .inp{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font-size:15px;background:#fff}
  .inp:focus{outline:2px solid var(--c);border-color:var(--c)}
  label.l{display:block;font-size:12px;color:#475569;margin:10px 0 3px;font-weight:600}
  .btn{background:var(--c);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;border:0;display:inline-block;text-align:center}
  .btn:hover{filter:brightness(.88)}.btn:disabled{opacity:.5;cursor:wait}
  .btn2{background:#e2e8f0;color:#0f172a}
  .btnr{background:#dc2626}
  .btnw{background:#16a34a}
  .btns{padding:5px 10px;font-size:12px;border-radius:8px}
  .tab{white-space:nowrap;padding:10px 14px;font-size:14px;font-weight:600;color:#475569;border-bottom:3px solid transparent;cursor:pointer}
  .tab.on{color:var(--c);border-color:var(--c)}
  .chip{padding:5px 12px;border-radius:999px;background:#e2e8f0;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--c);color:#fff}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;color:#475569;padding:8px;border-bottom:2px solid #e2e8f0;white-space:nowrap}
  td{padding:8px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  .wrap{overflow-x:auto}
  canvas.sig{width:100%;height:140px;border:1px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none}
  .modalbg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
  .modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px}
  .tabs{overflow-x:auto;display:flex;background:#fff;border-bottom:1px solid #e2e8f0}
  /* ---- Pantalla de ingreso ---- */
  #login{--ac:color-mix(in srgb,var(--c) 45%,#5eead4);position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(1200px 700px at 78% 12%,#0e2238 0%,transparent 60%),#050912;color:#e6edf7;font-family:'Sora',system-ui,sans-serif}
  #login:not(.hidden){display:flex}
  #login,#login *{box-sizing:border-box}
  #lgFx{position:absolute;inset:0;width:100%;height:100%}
  .lg-wrap{position:relative;z-index:1;width:100%;max-width:1080px;margin:auto;padding:24px;display:grid;gap:40px;align-items:center;grid-template-columns:1fr}
  @media(min-width:900px){.lg-wrap{grid-template-columns:1.15fr 420px;gap:72px}}
  .lg-mini{font-size:.8rem;font-weight:500;color:var(--ac);margin-bottom:6px}
  @media(min-width:900px){.lg-mini{display:none}}
  .lg-hero{display:none}
  @media(min-width:900px){.lg-hero{display:block}}
  .lg-hero h1{font-size:clamp(2.2rem,4.4vw,3.6rem);line-height:1.04;font-weight:600;letter-spacing:-.03em;color:#fff;max-width:11ch}
  .lg-lema{margin-top:18px;font-size:1.05rem;line-height:1.6;color:#8fa3c0;max-width:34ch}
  .lg-feat{list-style:none;margin:36px 0 0;padding:0;display:grid;gap:12px}
  .lg-feat li{padding-left:16px;border-left:2px solid var(--ac);font-size:.95rem;color:#c3d0e4}
  .lg-panel{background:rgba(10,18,32,.66);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(120,160,210,.2);border-radius:22px;padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}
  .lg-logo{display:inline-block;background:#fff;border-radius:12px;padding:6px 10px;margin-bottom:18px}.lg-logo img{height:38px;display:block}
  .lg-title{font-size:1.55rem;font-weight:600;letter-spacing:-.02em;color:#fff}
  .lg-sub{font-size:.85rem;color:#8fa3c0;margin-top:4px;margin-bottom:6px}
  .lg-panel label{display:block;font-size:.8rem;font-weight:500;color:#9fb2cd;margin:18px 0 6px}
  .lg-panel input{width:100%;background:rgba(3,8,18,.7);border:1px solid #243752;border-radius:12px;padding:13px 14px;font:inherit;font-size:.95rem;color:#fff;transition:border-color .15s,box-shadow .15s}
  .lg-panel input:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 28%,transparent)}
  .lg-err{min-height:20px;margin-top:12px;font-size:.85rem;color:#fda4af}
  .lg-btn{width:100%;margin-top:8px;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:600;font-size:.98rem;color:#04121a;cursor:pointer;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#38bdf8));box-shadow:0 8px 28px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .15s,filter .15s}
  .lg-btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.lg-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}.lg-btn:disabled{opacity:.6;cursor:wait}
</style>
</head>
<body>
<div id="toast" class="fixed top-3 left-1/2 -translate-x-1/2 z-[60] hidden px-4 py-2 rounded-lg text-white text-sm shadow-lg"></div>

<!-- LOGIN -->
<div id="login" class="hidden">
  <canvas id="lgFx" aria-hidden="true"></canvas>
  <div class="lg-wrap">
    <section class="lg-hero">
      <h1 class="app-name">Órdenes de Servicio</h1>
      <p id="lema" class="lg-lema"></p>
      <ul class="lg-feat">
        <li>Firma del cliente desde su celular</li>
        <li>Historial completo de cada unidad</li>
        <li>PDF listo para enviar al terminar</li>
      </ul>
    </section>
    <form id="fLogin" class="lg-panel">
      <div class="lg-logo"><img src="/logo" onerror="this.parentNode.style.display='none'" alt=""></div>
      <p class="lg-mini app-name">Órdenes de Servicio</p>
      <h2 class="lg-title">Iniciar sesión</h2>
      <p class="lg-sub">Accede con tu usuario y contraseña.</p>
      <label for="lu">Usuario</label><input id="lu" autocapitalize="none" autocomplete="username" required>
      <label for="lp">Contraseña</label><input id="lp" type="password" autocomplete="current-password" required>
      <p id="lerr" class="lg-err" role="alert"></p>
      <button class="lg-btn">Entrar</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <img src="/logo" onerror="this.style.display='none'" class="h-8" alt="">
      <div class="flex-1 min-w-0"><div class="font-bold app-name truncate">Órdenes de Servicio</div><div id="who" class="text-xs text-slate-500 truncate"></div></div>
      <button class="btn btn2 btns" data-a="miPass">Contraseña</button>
      <button class="btn btn2 btns" data-a="salir">Salir</button>
    </div>
    <div id="banner" class="text-sm px-4 py-2 bg-slate-50 text-slate-700 border-t border-slate-100"></div>
  </header>
  <nav class="tabs"><div id="tabs" class="flex max-w-6xl mx-auto w-full"></div></nav>
  <main id="pane" class="max-w-6xl mx-auto p-4"></main>
</div>
<div id="modal"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = { get(k){ try { return localStorage.getItem(k) || '' } catch(e){ return '' } }, set(k,v){ try { v ? localStorage.setItem(k,v) : localStorage.removeItem(k) } catch(e){} } };
let token = ls.get('ods_tk'), me = null, cfg = { nombre:'Órdenes de Servicio', empresa:'', color:'#0f766e', lema:'', motivos:[], elecItems:[], categorias:[], formatos:[], geotab:false };
let S = { servicios:[], vals:[], usuarios:[], salud:null }, tab = '', filtro = 'Todos', busca = '', capFolio = '', saludCat = '', saludQ = '', kpiP = 'mes', kpiD = '', kpiH = '', agP = '7dias', agTodos = false, agTec = '', cfgEdit = null, cfgId = null;
const ROL = { coord:'Coordinador', tec:'Técnico', soporte:'Soporte', cliente:'Cliente' };
const TABS = {
  coord:[['servicios','Servicios'],['nuevo','Nuevo servicio'],['agenda','Agenda'],['unidades','Unidades'],['solic','Solicitudes'],['usuarios','Usuarios'],['kpi','KPI'],['salud','Salud de equipos'],['config','Configuración']],
  soporte:[['solic','Solicitudes'],['servicios','Servicios'],['agenda','Agenda'],['unidades','Unidades'],['kpi','KPI'],['salud','Salud de equipos']],
  tec:[['servicios','Mis servicios'],['capturar','Capturar ODS'],['agenda','Agenda'],['unidades','Unidades'],['solic','Solicitudes']],
  cliente:[['servicios','Mis órdenes'],['agenda','Agenda'],['unidades','Unidades']] };
const tabsRol = () => TABS[me.rol].filter(([k]) => k !== 'salud' || cfg.geotab);
const ESTATUS = ['Todos','Enviado','En curso','Pendiente de firma','Completado'];
const ESTLBL = { 'Enviado':'Enviados', 'Completado':'Completados', 'Pendiente de firma':'Por firmar' };
const ANCHO = ['dom','lun','mar','mié','jue','vie','sáb'], MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

function toast(m, err){ const t = $('#toast'); t.textContent = m; t.className = 'fixed top-3 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-lg text-white text-sm shadow-lg ' + (err ? 'bg-red-600' : 'bg-emerald-600'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 4000); }
async function api(p, o = {}){
  const h = {}; if (token) h.Authorization = 'Bearer ' + token;
  let body = o.body; if (body && !(body instanceof FormData)){ h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  const r = await fetch('/api' + p, { method:o.method || 'GET', headers:h, body });
  let d = {}; try { d = await r.json(); } catch(e){}
  if (r.status === 401 && token && p !== '/login'){ salir(); throw new Error('Tu sesión venció, entra de nuevo'); }
  if (!r.ok || d.exito === false) throw new Error(d.error || ('Error ' + r.status));
  return d;
}
const fmtMin = m => m == null ? '—' : m < 1 ? '<1 min' : m < 60 ? m + ' min' : Math.floor(m/60) + ' h ' + (m%60) + ' min';
const fmtTs = t => t ? new Date(t).toLocaleString('es-MX', { timeZone:'America/Mexico_City', dateStyle:'short', timeStyle:'short' }) : '—';
const hoyMx = () => new Date(Date.now() - 6*3600e3).toISOString().slice(0,10);
const badge = (txt, col) => `<span class="badge" style="background:${col[0]};color:${col[1]}">${esc(txt)}</span>`;
const COL = { 'Enviado':['#e2e8f0','#334155'], 'En curso':['#fef3c7','#92400e'], 'Pendiente de firma':['#e0e7ff','#3730a3'], 'Completado':['#d1fae5','#065f46'],
  'Pendiente':['#fee2e2','#991b1b'], 'En atención':['#fef3c7','#92400e'], 'Validada':['#d1fae5','#065f46'], 'Con observaciones':['#ffedd5','#9a3412'], 'Requiere ajuste':['#ffedd5','#9a3412'],
  'OK':['#d1fae5','#065f46'], 'Advertencia':['#fef3c7','#92400e'], 'Crítico':['#fed7aa','#9a3412'], 'Crítico alto':['#fecaca','#991b1b'], 'Crítico severo':['#7f1d1d','#fff'], 'Desconocido':['#e2e8f0','#334155'] };
const bd = e => badge(e, COL[e] || COL.Enviado);
function waLink(tel, texto){
  const m = String(tel || '').match(/\+?\d[\d\s().-]{8,}\d/); if (!m) return '';
  let d = m[0].replace(/\D/g, ''); if (d.length === 10) d = '52' + d; if (d.length < 11) return '';
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(texto);
}
const fmtDe = s => cfg.formatos.find(f => f.id === (s && s.formato)) || cfg.formatos[0] || { campos:[], titulo:'', elec:false, fotos:true };
const diaLbl = ts => { const d = new Date(ts - 6*3600e3); return `${ANCHO[d.getUTCDay()]} ${d.getUTCDate()} ${MESES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
function aplicaCfg(){
  document.title = cfg.nombre; document.documentElement.style.setProperty('--c', cfg.color || '#0f766e');
  document.querySelectorAll('.app-name').forEach(e => e.textContent = cfg.nombre); $('#lema').textContent = cfg.lema || '';
}
function modal(html){ $('#modal').innerHTML = `<div class="modalbg" data-a="cerrarBg"><div class="modal">${html}</div></div>`; }
function cerrar(){ $('#modal').innerHTML = ''; }
const urlAbs = u => location.origin + u;
// Los PDF se ven en el visor (otra pestaña, sin descargar); desde ahí el botón Descargar los baja
const ver = u => '/visor.html?f=' + encodeURIComponent(String(u || '').replace('/ods/', ''));

// ---------- Sesión ----------
async function init(){
  try { cfg = await api('/config'); aplicaCfg(); } catch(e){}
  if (token){ try { me = (await api('/yo')).usuario; return entrar(); } catch(e){} }
  $('#login').classList.remove('hidden');
}
$('#fLogin').addEventListener('submit', async e => {
  e.preventDefault(); $('#lerr').textContent = '';
  try { const d = await api('/login', { method:'POST', body:{ usuario:$('#lu').value, password:$('#lp').value } });
    token = d.token; ls.set('ods_tk', token); me = d.usuario; $('#lp').value = ''; entrar();
  } catch(err){ $('#lerr').textContent = err.message; }
});
function salir(){ token = ''; ls.set('ods_tk',''); me = null; clearInterval(window._iv); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); cerrar(); }
async function entrar(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = me.nombre + ' · ' + ROL[me.rol];
  $('#banner').style.display = me.rol === 'cliente' ? 'none' : '';
  $('#tabs').innerHTML = tabsRol().map(([k,n]) => `<div class="tab" data-a="tab" data-t="${k}">${n}</div>`).join('');
  if (me.debeCambiar) miPass(true);
  const cargas = [cargaServ()]; if (me.rol !== 'cliente'){ cargas.push(cargaVals(), cargaTurno()); }
  await Promise.all(cargas.map(p => p.catch(() => {})));
  if (me.rol === 'coord') cargaUsuarios().catch(() => {});
  irTab(tabsRol()[0][0]);
  clearInterval(window._iv); window._iv = setInterval(async () => { if (!token || me.rol === 'cliente') return; await cargaTurno(); if (tab === 'solic'){ await cargaVals(); pintaSolic(); } }, 30000);
}
function miPass(forzado){
  modal(`<h3 class="font-bold text-lg mb-1">Cambiar contraseña</h3>${forzado ? '<p class="text-sm text-amber-700">Estás usando la contraseña inicial. Cámbiala para continuar.</p>' : ''}
    <label class="l">Contraseña actual</label><input id="pa" type="password" class="inp">
    <label class="l">Nueva contraseña (mínimo 8 caracteres)</label><input id="pn" type="password" class="inp">
    <div class="flex gap-2 mt-4"><button class="btn" data-a="guardaPass">Guardar</button>${forzado ? '' : '<button class="btn btn2" data-a="cerrar">Cancelar</button>'}</div>`);
}

// ---------- Datos ----------
async function cargaServ(){ S.servicios = (await api('/servicios')).servicios; }
async function cargaVals(){
  S.vals = (await api('/validaciones')).validaciones;
  const n = me.rol === 'tec' ? S.vals.filter(v => ['Requiere ajuste', 'Con observaciones'].includes(v.estado) && !S.vals.some(o => o.folio === v.folio && o.creadoEn > v.creadoEn)).length : S.vals.filter(v => v.estado === 'Pendiente').length;
  const el = document.querySelector('.tab[data-t="solic"]'); if (el) el.textContent = 'Solicitudes' + (n ? ' (' + n + ')' : '');
}
async function cargaUsuarios(){ S.usuarios = (await api('/usuarios')).usuarios; }
async function cargaTurno(){
  try { const t = (await api('/turno')).turno;
    $('#banner').innerHTML = t.length ? '<b>Soporte en turno:</b> ' + t.map(x => `${esc(x.nombre)} (${esc(x.inicio)}–${esc(x.fin)}) · atendiendo ${x.atendiendo}${x.tecnicos.length ? ' [' + x.tecnicos.map(esc).join(', ') + ']' : ''}`).join(' &nbsp;|&nbsp; ')
      : 'Sin soporte en turno en este momento';
  } catch(e){}
}
async function irTab(t){
  tab = t;
  document.querySelectorAll('.tab').forEach(e => e.classList.toggle('on', e.dataset.t === t));
  const P = { servicios:pintaServ, nuevo:pintaNuevo, capturar:pintaCap, solic:pintaSolic, usuarios:pintaUsers, kpi:pintaKpi, salud:pintaSalud, agenda:pintaAgenda, unidades:pintaUnidades, config:pintaConfig };
  if (t === 'config'){ cfgEdit = null; cfgId = null; }
  try {
    if (['servicios','capturar','nuevo','agenda'].includes(t)) await cargaServ();
    if (t === 'solic' || t === 'capturar') await cargaVals();
    if (['usuarios','nuevo','agenda','config'].includes(t) && me.rol === 'coord') await cargaUsuarios();
  } catch(e){ toast(e.message, 1); }
  P[t]();
}

// ---------- Servicios ----------
function pintaServ(){
  $('#pane').innerHTML = `<div class="card">
    <div class="flex flex-wrap gap-2 items-center mb-3">
      ${ESTATUS.map(f => `<span class="chip ${f === filtro ? 'on' : ''}" data-a="filtro" data-f="${f}">${ESTLBL[f] || f}</span>`).join('')}
      <input id="q" class="inp" style="max-width:260px;margin-left:auto" placeholder="Buscar folio, cliente, técnico, placas..." value="${esc(busca)}">
      ${me.rol === 'coord' ? '<button class="btn btn2 btns" data-a="exportaServ">Exportar Excel</button>' : ''}
    </div><div id="tbl" class="wrap"></div></div>`;
  $('#q').addEventListener('input', e => { busca = e.target.value; pintaTablaServ(); });
  pintaTablaServ();
}
function listaServ(){
  const q = busca.toLowerCase();
  return S.servicios.filter(s => (filtro === 'Todos' || s.estatus === filtro) && (!q || [s.folio, s.cliente, s.tecnico, s.motivo, s.ciudad, s.placas, s.imei, s.economico, s.serie].join(' ').toLowerCase().includes(q)));
}
function pintaTablaServ(){
  const l = listaServ();
  $('#tbl').innerHTML = l.length ? `<table><thead><tr><th>Folio</th><th>Técnico</th><th>Fecha</th><th>Motivo</th><th>Cliente</th><th>Estatus</th><th>Duración</th><th></th></tr></thead><tbody>${l.map(s => `<tr>
    <td class="font-semibold">${esc(s.folio)}</td><td>${esc(s.tecnico)}</td><td class="whitespace-nowrap">${esc(s.fecha)} ${esc(s.hora)}</td><td>${esc(s.motivo)}</td><td>${esc(s.cliente)}</td>
    <td>${bd(s.estatus)}</td><td class="whitespace-nowrap">${fmtMin(s.duracion)}</td>
    <td class="whitespace-nowrap text-right">
      ${me.rol === 'tec' && s.estatus !== 'Completado' ? `<button class="btn btns" data-a="capturar" data-f="${esc(s.folio)}">${s.estatus === 'Enviado' ? 'Iniciar' : 'Continuar'}</button> ` : ''}
      ${s.estatus === 'Pendiente de firma' && ['tec','coord'].includes(me.rol) ? `<button class="btn btns" data-a="linkFirma" data-f="${esc(s.folio)}">Link de firma</button> ` : ''}
      ${s.urlDoc && s.estatus === 'Completado' ? `<a class="btn btn2 btns" href="${esc(ver(s.urlDoc))}" target="_blank">Ver PDF</a> ` : ''}
      ${s.urlDoc && s.estatus === 'Completado' && me.rol !== 'cliente' ? `<button class="btn btn2 btns" data-a="enviaPdf" data-f="${esc(s.folio)}">Enviar PDF</button> ` : ''}
      ${s.estatus === 'Completado' && ['tec','coord'].includes(me.rol) ? `<button class="btn btn2 btns" data-a="pedirVal" data-f="${esc(s.folio)}">Validar</button> ` : ''}
      <button class="btn btn2 btns" data-a="detalle" data-f="${esc(s.folio)}">Ver</button>
      ${me.rol === 'coord' ? `<button class="btn btnr btns" data-a="borraServ" data-f="${esc(s.folio)}">Eliminar</button>` : ''}
    </td></tr>`).join('')}</tbody></table>` : '<p class="text-slate-500 text-sm py-6 text-center">No hay servicios para mostrar.</p>';
}
function detalle(folio){
  const s = S.servicios.find(x => x.folio === folio); if (!s) return;
  const F = fmtDe(s), f = (l, v) => v ? `<div><div class="text-xs text-slate-500">${esc(l)}</div><div class="text-sm">${esc(v)}</div></div>` : '';
  modal(`<div class="flex justify-between items-start"><h3 class="font-bold text-lg">${esc(s.folio)}</h3>${bd(s.estatus)}</div>
    <div class="text-xs text-slate-500">${esc(F.nombre || '')}</div>
    <div class="grid grid-cols-2 gap-3 mt-3">${f('Técnico',s.tecnico)}${f('Fecha',s.fecha + ' ' + s.hora)}${f('Motivo',s.motivo)}${f('Cliente',s.cliente)}${f('Razón social',s.razon)}${f('Lugar',s.lugar)}
      ${f('Recibe',s.recibe)}${f('Contacto',s.contacto)}${f('Ciudad',s.ciudad)}${f('Estado',s.edo)}
      ${F.campos.filter(c => c.on).map(c => f(c.label, s[c.k])).join('')}${f('Arnés utilizado', s.arnes)}

function muestraForm(){

function iniFirma(id){
  const c = $('#' + id), r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1; c.width = r.width * k; c.height = r.height * k;
  const g = c.getContext('2d'); g.scale(k, k); g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = '#0f172a'; sigs[id] = false;
  let d = false; const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  c.onpointerdown = e => { d = true; c.setPointerCapture(e.pointerId); g.beginPath(); g.moveTo(...pos(e)); };
  c.onpointermove = e => { if (!d) return; g.lineTo(...pos(e)); g.stroke(); sigs[id] = true; };
  c.onpointerup = c.onpointercancel = () => { d = false; };
}
function limpiaSig(id){ const c = $('#' + id); c.getContext('2d').clearRect(0, 0, c.width, c.height); sigs[id] = false; }
async function reducir(file){
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82));
  } catch(e){ return file; }
}
async function generaOds(e){
  e.preventDefault(); const f = $('#fcap'), btn = $('#bGen');
  for (const el of f.querySelectorAll('input[data-req="1"],select[data-req="1"]')) if (!el.value.trim()) return toast('Falta: ' + el.dataset.lbl, 1);
  if (!sigs.sigT) return toast('Falta la firma del técnico', 1);
  const remota = !sigs.sigC;
  if (remota && !confirm('El cliente no firmó. Se creará un link para que firme desde su celular y el PDF final se generará cuando lo haga. ¿Continuar?')) return;
  btn.disabled = true; btn.textContent = 'Guardando...';
  try {
    const fd = new FormData(); fd.append('folioAcuerdo', capFolio);
    for (const el of f.elements){
      if (!el.name) continue;
      if (el.type === 'file'){ for (const file of el.files) fd.append(el.name, await reducir(file), file.name.replace(/\.\w+$/, '') + '.jpg'); }
      else if (el.type === 'radio'){ if (el.checked) fd.append(el.name, el.value); }
      else fd.append(el.name, el.value);
    }
    if (!remota) fd.append('firmaCliente', $('#sigC').toDataURL('image/png'));
    fd.append('firmaTecnico', $('#sigT').toDataURL('image/png'));
    const d = await api('/generar-ods', { method:'POST', body:fd });
    await cargaServ(); capFolio = '';
    if (d.pendienteFirma) { linkModal(d.firmaUrl, d.folio, d.contacto, ''); }
    else pdfModal(d.descargaUrl, d.folio, d.contacto, d.cliente);
    irTab('servicios');
  } catch(err){ toast(err.message, 1); btn.disabled = false; btn.textContent = 'Terminar y generar ODS'; }
}

function pintaSaludTabla(full){
  const U = S.salud.unidades, n = U.length, cnt = c => U.filter(u => u.categoria === c).length;
  const ok = cnt('OK'), crit = U.filter(u => u.categoria.startsWith('Crítico')).length;
  const q = saludQ.toLowerCase(), l = U.filter(u => (!saludCat || u.categoria === saludCat) && (!q || [u.nombre, u.serie, u.vin, u.placas].join(' ').toLowerCase().includes(q)));

      <div class="card"><div class="text-xs text-slate-500">Unidades totales</div><div class="text-2xl font-bold">${n}</div></div>
      <div class="card"><div class="text-xs text-slate-500">GPS al día</div><div class="text-2xl font-bold">${n ? Math.round(ok * 100 / n) : 0}%</div></div>
      <div class="card"><div class="text-xs text-slate-500">Críticas GPS</div><div class="text-2xl font-bold">${crit}</div></div></div>
    <div class="card"><div class="flex flex-wrap gap-2 items-center mb-3">
      <span class="chip ${saludCat === '' ? 'on' : ''}" data-a="saludCat" data-c="">Todas (${n})</span>
      ${cfg.categorias.map(([c, d]) => `<span class="chip ${saludCat === c ? 'on' : ''}" data-a="saludCat" data-c="${c}" title="${esc(d)}">${c} (${cnt(c)})</span>`).join('')}
      <input id="sq" class="inp" style="max-width:240px;margin-left:auto" placeholder="Buscar unidad, serie, VIN..." value="${esc(saludQ)}">
      <button class="btn btn2 btns" data-a="saludXls">Excel</button><button class="btn btn2 btns" data-a="saludRef">Actualizar</button></div>
      <p class="text-xs text-slate-500 mb-2">Actualizado: ${fmtTs(S.salud.actualizado)} · se refresca cada 60 minutos.</p>
      <div id="stbl" class="wrap"></div></div>`;
  document.querySelectorAll('[data-a="saludCat"]').forEach(e => e.classList.toggle('on', e.dataset.c === saludCat));
  const sq = $('#sq'); if (sq && !sq._b){ sq._b = 1; sq.addEventListener('input', e => { saludQ = e.target.value; pintaSaludTabla(false); }); }
  $('#stbl').innerHTML = `<table><thead><tr><th>Unidad</th><th>Serie</th><th>VIN</th><th>Placas</th><th>Última comunicación</th><th>Días</th><th>Categoría</th></tr></thead><tbody>
    ${l.slice(0, 1000).map(u => `<tr><td>${esc(u.nombre)}</td><td>${esc(u.serie)}</td><td>${esc(u.vin)}</td><td>${esc(u.placas)}</td><td>${fmtTs(u.ultima && Date.parse(u.ultima))}</td><td>${u.dias ?? '—'}</td><td>${bd(u.categoria)}</td></tr>`).join('') || '<tr><td colspan="7" class="text-slate-500">Sin resultados.</td></tr>'}</tbody></table>`;
}

function enlazaCfg(e){
  const el = e.target, i = el.dataset.i; if (i === undefined || !cfgEdit) return;

  if (el.dataset.fp) F[el.dataset.fp] = val;
  else if (el.dataset.ck){ const c = F.campos.find(x => x.k === el.dataset.ck); if (c) c[el.dataset.cp] = val; }
}

// ---------- Fondo animado de la pantalla de ingreso: rutas de telemetría sobre una cuadrícula ----------
(function(){
  const cv = $('#lgFx'); if (!cv) return; const g = cv.getContext('2d'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, K, rutas = [], t0 = performance.now();
  let colC = '#2dd4bf', colT = 0;
  const col = () => { const n = performance.now(); if (n - colT > 1500){ colT = n; const i = document.createElement('i'); i.style.color = 'var(--ac)'; $('#login').appendChild(i); colC = getComputedStyle(i).color || colC; i.remove(); } return colC; };
  function nuevaRuta(){
    const G = 56, cols = Math.ceil(W / G), rows = Math.ceil(H / G); let x = Math.floor(Math.random() * cols), y = Math.floor(Math.random() * rows); const pts = [[x * G, y * G]];
    for (let i = 0; i < 9; i++){ const dx = [1, 0, -1, 0, 1, -1][Math.floor(Math.random() * 6)], dy = dx === 0 ? [1, -1][Math.floor(Math.random() * 2)] : [0, 0, 1, -1][Math.floor(Math.random() * 4)]; x = Math.max(0, Math.min(cols, x + dx * (1 + Math.floor(Math.random() * 3)))); y = Math.max(0, Math.min(rows, y + dy * (1 + Math.floor(Math.random() * 3)))); pts.push([x * G, y * G]); }
    let len = 0; const seg = []; for (let i = 1; i < pts.length; i++){ const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); len += l; }
    return { pts, seg, len: Math.max(len, 1), v: 55 + Math.random() * 60, off: Math.random() * 1e4 };
  }
  function medida(){ K = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * K; cv.height = H * K; g.setTransform(K, 0, 0, K, 0, 0); rutas = Array.from({ length: W < 700 ? 4 : 8 }, nuevaRuta); }
  function punto(r, d){ d = d % r.len; for (let i = 0; i < r.seg.length; i++){ if (d <= r.seg[i]){ const k = r.seg[i] ? d / r.seg[i] : 0, a = r.pts[i], b = r.pts[i + 1]; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; } d -= r.seg[i]; } return r.pts[0]; }
  function pinta(now){
    const c = col(), s = (now - t0) / 1000; g.clearRect(0, 0, W, H);
    g.strokeStyle = 'rgba(120,160,210,.07)'; g.lineWidth = 1; g.beginPath();
    for (let x = 0; x <= W; x += 56){ g.moveTo(x + .5, 0); g.lineTo(x + .5, H); } for (let y = 0; y <= H; y += 56){ g.moveTo(0, y + .5); g.lineTo(W, y + .5); } g.stroke();
    rutas.forEach(r => {
      g.beginPath(); r.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = 'rgba(120,170,220,.13)'; g.lineWidth = 1.2; g.stroke();
      r.pts.forEach(p => { g.fillStyle = 'rgba(120,170,220,.25)'; g.fillRect(p[0] - 2, p[1] - 2, 4, 4); });
      const d = r.off + s * r.v;
      for (let i = 14; i >= 0; i--){ const p = punto(r, Math.max(0, d - i * 7)); g.globalAlpha = (1 - i / 15) * .55; g.fillStyle = c; g.beginPath(); g.arc(p[0], p[1], 2.2 * (1 - i / 22), 0, 7); g.fill(); }
      g.globalAlpha = 1; const h = punto(r, d); g.fillStyle = '#fff'; g.beginPath(); g.arc(h[0], h[1], 2.6, 0, 7); g.fill();
      g.strokeStyle = c; g.globalAlpha = .35 + .25 * Math.sin(s * 3 + r.off); g.beginPath(); g.arc(h[0], h[1], 8, 0, 7); g.stroke(); g.globalAlpha = 1;
    });
  }
  function bucle(now){ if ($('#login').offsetParent !== null) pinta(now); if (!reduce) requestAnimationFrame(bucle); }
  addEventListener('resize', () => { medida(); if (reduce) pinta(performance.now()); });
  medida(); if (reduce) setTimeout(() => pinta(performance.now() + 2000), 300); else requestAnimationFrame(bucle);
})();
init();
